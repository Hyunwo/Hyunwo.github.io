<svg width="1000" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2f6fb3"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#27824f"/></marker>
    <marker id="aK" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888888"/></marker>
    <g id="srv">
      <rect x="0" y="0" width="15" height="4.2" rx="1" fill="#ffffff" stroke="#555555" stroke-width="1"/>
      <rect x="0" y="5.6" width="15" height="4.2" rx="1" fill="#ffffff" stroke="#555555" stroke-width="1"/>
      <rect x="0" y="11.2" width="15" height="4.2" rx="1" fill="#ffffff" stroke="#555555" stroke-width="1"/>
      <circle cx="2.4" cy="2.1" r="0.8" fill="#555555"/><circle cx="2.4" cy="7.7" r="0.8" fill="#555555"/><circle cx="2.4" cy="13.3" r="0.8" fill="#555555"/>
    </g>
    <g id="bucket">
      <ellipse cx="14" cy="5" rx="14" ry="5" fill="#ffffff" stroke="#27824f" stroke-width="1.5"/>
      <path d="M0,5 L4,30 C4,32 9,33 14,33 C19,33 24,32 24,30 L28,5" fill="#ffffff" stroke="#27824f" stroke-width="1.5"/>
    </g>
    <g id="key">
      <circle cx="6" cy="6" r="5" fill="#ffffff" stroke="#2f6fb3" stroke-width="1.4"/>
      <line x1="10" y1="10" x2="22" y2="22" stroke="#2f6fb3" stroke-width="1.6"/>
      <line x1="17" y1="17" x2="21" y2="13" stroke="#2f6fb3" stroke-width="1.4"/>
    </g>
  </defs>

  <text x="500" y="32" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">실습 흐름: EC2가 시작되면서 S3에서 index.html을 가져온다</text>

  <rect x="330" y="75" width="340" height="86" rx="10" fill="#eafaf1" stroke="#27824f" stroke-width="2"/>
  <use href="#bucket" x="346" y="95"/>
  <text x="520" y="106" font-size="12.5" font-weight="bold" fill="#1c5c38" text-anchor="middle">S3 버킷 (서울 리전)</text>
  <text x="520" y="126" font-size="10.5" fill="#1c5c38" text-anchor="middle">demo-my-s3-bucket-&lt;계정ID&gt;</text>
  <text x="520" y="145" font-size="10.5" fill="#1c5c38" text-anchor="middle">└ index.html (Hello World)</text>

  <rect x="50" y="85" width="170" height="66" rx="8" fill="#f3f3f3" stroke="#888888" stroke-width="1.8"/>
  <text x="135" y="112" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">① 나(관리자)</text>
  <text x="135" y="132" font-size="10" fill="#777777" text-anchor="middle">콘솔에서 index.html 업로드</text>
  <line x1="220" y1="118" x2="325" y2="118" stroke="#27824f" stroke-width="2" marker-end="url(#aG)"/>

  <rect x="300" y="290" width="400" height="130" rx="10" fill="#f3f3f3" stroke="#888888" stroke-width="2"/>
  <use href="#srv" x="316" y="304"/>
  <text x="510" y="316" font-size="13" font-weight="bold" fill="#555555" text-anchor="middle">③ EC2 인스턴스 (demo-s3-test)</text>
  <text x="510" y="338" font-size="10.5" fill="#555555" text-anchor="middle">User Data: 웹서버 설치·실행 → 버킷의 index.html을 웹 루트로 복사</text>

  <rect x="330" y="354" width="340" height="50" rx="7" fill="#eaf2fb" stroke="#2f6fb3" stroke-width="1.6"/>
  <use href="#key" x="342" y="366"/>
  <text x="510" y="373" font-size="11" font-weight="bold" fill="#1f4e79" text-anchor="middle">② IAM 역할 (인스턴스 프로파일)</text>
  <text x="510" y="391" font-size="9.5" fill="#1f4e79" text-anchor="middle">S3 접근 권한 · 액세스 키를 서버에 저장하지 않는다</text>

  <line x1="510" y1="290" x2="510" y2="165" stroke="#2f6fb3" stroke-width="2" marker-end="url(#aB)"/>
  <text x="522" y="232" font-size="10.5" fill="#1f4e79">부팅 시 AWS CLI로 다운로드</text>

  <rect x="790" y="320" width="170" height="66" rx="8" fill="#f3f3f3" stroke="#888888" stroke-width="1.8"/>
  <text x="875" y="347" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">④ 브라우저</text>
  <text x="875" y="367" font-size="10" fill="#777777" text-anchor="middle">Public DNS 접속 → Hello World</text>
  <line x1="788" y1="353" x2="705" y2="353" stroke="#888888" stroke-width="1.8" marker-end="url(#aK)"/>

  <rect x="50" y="230" width="190" height="64" rx="8" fill="#fdf3d9" stroke="#c99a1e" stroke-width="1.3"/>
  <text x="145" y="254" font-size="10.5" font-weight="bold" fill="#8a6a10" text-anchor="middle">실전에서는 index.html 대신</text>
  <text x="145" y="272" font-size="10.5" fill="#8a6a10" text-anchor="middle">설정 파일·이미지·소스 등을</text>
  <text x="145" y="288" font-size="10.5" fill="#8a6a10" text-anchor="middle">같은 방식으로 내려받는다</text>
</svg>
