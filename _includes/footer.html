<footer class="site-footer h-card" style="margin-top:3.5rem; padding:32px 0 40px; border-top:1px solid #e4e8ee; text-align:center;">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>
  <div class="wrapper" style="text-align:center;">
    <p style="margin:0 0 8px; font-size:1.05rem; font-weight:700; color:#1f2933;">{{ site.title | escape }}</p>
    <p style="margin:0 0 14px; font-size:14px; color:#6b7585;">{{ site.description | escape }}</p>
    <p style="margin:0 0 14px; font-size:14px;">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <span style="margin:0 10px; color:#c3cad4;">·</span>
      <a href="https://github.com/Hyunwo">GitHub</a>
    </p>
    <p style="margin:0; font-size:12px; color:#9aa3b0;">© {{ site.time | date: '%Y' }} 정현우</p>
  </div>
</footer>
