<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Noto Sans CJK KR, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1600" height="820" fill="#fff"/>
<text x="800.0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#222">지표 한 줄의 구조와 보관 기간</text>
<defs><marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2f6fb5"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#7a3db8"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#d9772b"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1f7a4d"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c0392b"/></marker><marker id="k" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#666666"/></marker><marker id="y" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b8860b"/></marker></defs>
<rect x="40" y="80" width="1520" height="300" rx="16" fill="#f6f9fd" stroke="#2f6fb5" stroke-width="3"/>
<text x="70" y="120" text-anchor="start" font-size="21" fill="#2f6fb5" font-weight="700">지표 = 네임스페이스 + 지표 이름 + 디멘션(0개 이상)</text>
<rect x="70" y="150" width="280" height="90" rx="14" fill="#fff" stroke="#2f6fb5" stroke-width="3"/>
<text x="210.0" y="193.0" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fb5">네임스페이스</text>
<text x="210.0" y="217.0" text-anchor="middle" font-size="15" fill="#444">AWS/EC2  (필수)</text>
<rect x="370" y="150" width="280" height="90" rx="14" fill="#fff" stroke="#1f7a4d" stroke-width="3"/>
<text x="510.0" y="193.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">지표 이름</text>
<text x="510.0" y="217.0" text-anchor="middle" font-size="15" fill="#444">CPUUtilization  (필수)</text>
<rect x="670" y="150" width="330" height="90" rx="14" fill="#fff" stroke="#7a3db8" stroke-width="3"/>
<text x="835.0" y="193.0" text-anchor="middle" font-size="20" font-weight="700" fill="#7a3db8">디멘션 (최대 30개)</text>
<text x="835.0" y="217.0" text-anchor="middle" font-size="15" fill="#444">InstanceId = i-0abc...</text>
<rect x="1020" y="150" width="240" height="90" rx="14" fill="#fff" stroke="#d9772b" stroke-width="3"/>
<text x="1140.0" y="193.0" text-anchor="middle" font-size="20" font-weight="700" fill="#d9772b">단위</text>
<text x="1140.0" y="217.0" text-anchor="middle" font-size="15" fill="#444">Percent</text>
<rect x="1280" y="150" width="250" height="90" rx="14" fill="#fff" stroke="#c0392b" stroke-width="3"/>
<text x="1405.0" y="193.0" text-anchor="middle" font-size="20" font-weight="700" fill="#c0392b">데이터 포인트</text>
<text x="1405.0" y="217.0" text-anchor="middle" font-size="15" fill="#444">시간(UTC) + 값</text>
<text x="800" y="290" text-anchor="middle" font-size="17" fill="#444">같은 이름이어도 디멘션 조합이 다르면 서로 다른 지표</text>
<text x="800" y="325" text-anchor="middle" font-size="16" fill="#444">커스텀 지표는 네임스페이스를 직접 정한다 (예: MyApp/Server) · 메모리는 CloudWatch 에이전트로 보낸다</text>
<text x="800" y="358" text-anchor="middle" font-size="15" fill="#666">타임스탬프는 UTC 권장 · 과거 2주 ~ 미래 2시간 이내</text>
<text x="70" y="430" text-anchor="start" font-size="21" fill="#222" font-weight="700">데이터 보관 기간 (해상도별, 시간이 지나면 큰 단위로 합쳐진다)</text>
<rect x="70" y="470" width="330" height="150" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="235.0" y="543.0" text-anchor="middle" font-size="26" font-weight="700" fill="#c0392b">60초 미만</text>
<text x="235.0" y="567.0" text-anchor="middle" font-size="15" fill="#444">3시간</text>
<text x="235" y="600" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="700">고해상도</text>
<line x1="400" y1="545" x2="440" y2="545" stroke="#666" stroke-width="4" marker-end="url(#k)"/>
<rect x="450" y="470" width="330" height="150" rx="14" fill="#fdf0e6" stroke="#d9772b" stroke-width="3"/>
<text x="615.0" y="543.0" text-anchor="middle" font-size="26" font-weight="700" fill="#d9772b">1분 (60초)</text>
<text x="615.0" y="567.0" text-anchor="middle" font-size="15" fill="#444">15일</text>
<text x="615" y="600" text-anchor="middle" font-size="16" fill="#d9772b" font-weight="700">표준</text>
<line x1="780" y1="545" x2="820" y2="545" stroke="#666" stroke-width="4" marker-end="url(#k)"/>
<rect x="830" y="470" width="330" height="150" rx="14" fill="#f3eafb" stroke="#7a3db8" stroke-width="3"/>
<text x="995.0" y="543.0" text-anchor="middle" font-size="26" font-weight="700" fill="#7a3db8">5분 (300초)</text>
<text x="995.0" y="567.0" text-anchor="middle" font-size="15" fill="#444">63일</text>
<line x1="1160" y1="545" x2="1200" y2="545" stroke="#666" stroke-width="4" marker-end="url(#k)"/>
<rect x="1210" y="470" width="330" height="150" rx="14" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="3"/>
<text x="1375.0" y="543.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1f7a4d">1시간 (3600초)</text>
<text x="1375.0" y="567.0" text-anchor="middle" font-size="15" fill="#444">455일 (15개월)</text>
<text x="800" y="670" text-anchor="middle" font-size="16" fill="#444">콘솔에서는 최근 2주 동안 새 데이터가 없는 지표가 보이지 않는다 (CLI의 get-metric-data로 조회)</text>
<text x="800" y="700" text-anchor="middle" font-size="16" fill="#444">지표는 삭제할 수 없고 15개월 동안 새 데이터가 없으면 만료된다</text>
<text x="800" y="780" text-anchor="middle" font-size="16" fill="#666">EC2 기본 모니터링은 5분 간격, 상세 모니터링을 켜면 1분 간격</text>
</svg>