<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Noto Sans CJK KR, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1600" height="820" fill="#fff"/>
<text x="800.0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#222">경보: 상태 변화에서 자동 대응까지</text>
<defs><marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2f6fb5"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#7a3db8"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#d9772b"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1f7a4d"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c0392b"/></marker><marker id="k" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#666666"/></marker><marker id="y" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b8860b"/></marker></defs>
<rect x="40" y="90" width="620" height="320" rx="14" fill="#fafafa" stroke="#999" stroke-width="2"/>
<text x="60" y="122" text-anchor="start" font-size="17" fill="#444" font-weight="700">CPUUtilization (period 5분)</text>
<line x1="80" y1="250" x2="640" y2="250" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="90" y="242" text-anchor="start" font-size="15" fill="#c0392b">임계치 80%</text>
<polyline points="90,330 150,320 210,300 270,230 330,200 390,215 450,320 510,310 570,230 630,330" fill="none" stroke="#2f6fb5" stroke-width="4"/>
<circle cx="90" cy="330" r="6" fill="#2f6fb5"/>
<circle cx="150" cy="320" r="6" fill="#2f6fb5"/>
<circle cx="210" cy="300" r="6" fill="#2f6fb5"/>
<circle cx="270" cy="230" r="6" fill="#2f6fb5"/>
<circle cx="330" cy="200" r="6" fill="#2f6fb5"/>
<circle cx="390" cy="215" r="6" fill="#2f6fb5"/>
<circle cx="450" cy="320" r="6" fill="#2f6fb5"/>
<circle cx="510" cy="310" r="6" fill="#2f6fb5"/>
<circle cx="570" cy="230" r="6" fill="#2f6fb5"/>
<circle cx="630" cy="330" r="6" fill="#2f6fb5"/>
<text x="360" y="395" text-anchor="middle" font-size="15" fill="#444">초과 지속 → ALARM · 기준 아래로 복귀 → OK</text>
<rect x="740" y="100" width="240" height="80" rx="14" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="3"/>
<text x="860.0" y="138.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1f7a4d">OK</text>
<text x="860.0" y="162.0" text-anchor="middle" font-size="15" fill="#444">임계치 이내</text>
<rect x="1010" y="100" width="240" height="80" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="1130.0" y="138.0" text-anchor="middle" font-size="26" font-weight="700" fill="#c0392b">ALARM</text>
<text x="1130.0" y="162.0" text-anchor="middle" font-size="15" fill="#444">임계치 벗어남</text>
<rect x="1280" y="100" width="260" height="80" rx="14" fill="#f2f2f2" stroke="#666" stroke-width="3"/>
<text x="1410.0" y="138.0" text-anchor="middle" font-size="20" font-weight="700" fill="#666">INSUFFICIENT_DATA</text>
<text x="1410.0" y="162.0" text-anchor="middle" font-size="15" fill="#444">데이터 부족 · 생성 직후</text>
<line x1="980" y1="140" x2="1010" y2="140" stroke="#666" stroke-width="4" marker-end="url(#k)"/>
<line x1="1010" y1="160" x2="980" y2="160" stroke="#666" stroke-width="4" marker-end="url(#k)"/>
<text x="1110" y="230" text-anchor="middle" font-size="16" fill="#444" font-weight="700">평가 조건 3가지: 기간(Period) · 평가 기간 수 · 경보 데이터 포인트 수</text>
<text x="1110" y="258" text-anchor="middle" font-size="15" fill="#444">예) 3개 중 3개가 초과해야 ALARM (M out of N 설정도 가능)</text>
<text x="1110" y="284" text-anchor="middle" font-size="15" fill="#444">60초 이상 기간은 매분 평가 · 10·20·30초 기간(고해상도)은 10초마다 평가</text>
<text x="1110" y="310" text-anchor="middle" font-size="15" fill="#444">고해상도 경보는 요금이 더 높다</text>
<rect x="60" y="490" width="220" height="90" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="170.0" y="533.0" text-anchor="middle" font-size="20" font-weight="700" fill="#c0392b">경보</text>
<text x="170.0" y="557.0" text-anchor="middle" font-size="15" fill="#444">상태가 바뀔 때 동작</text>
<rect x="370" y="490" width="200" height="90" rx="14" fill="#fff7d6" stroke="#b8860b" stroke-width="3"/>
<text x="470.0" y="533.0" text-anchor="middle" font-size="20" font-weight="700" fill="#b8860b">SNS 주제</text>
<text x="470.0" y="557.0" text-anchor="middle" font-size="15" fill="#444">알림 전달</text>
<rect x="700" y="440" width="240" height="70" rx="14" fill="#e9f1fb" stroke="#2f6fb5" stroke-width="3"/>
<text x="820.0" y="482.0" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fb5">이메일 · SMS</text>
<rect x="700" y="525" width="240" height="70" rx="14" fill="#f3eafb" stroke="#7a3db8" stroke-width="3"/>
<text x="820.0" y="567.0" text-anchor="middle" font-size="20" font-weight="700" fill="#7a3db8">Lambda → Slack</text>
<rect x="700" y="610" width="240" height="70" rx="14" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="3"/>
<text x="820.0" y="652.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">HTTP 엔드포인트 등</text>
<line x1="280" y1="535" x2="370" y2="535" stroke="#c0392b" stroke-width="4" marker-end="url(#r)"/>
<line x1="570" y1="520" x2="700" y2="475" stroke="#2f6fb5" stroke-width="4" marker-end="url(#b)"/>
<line x1="570" y1="535" x2="700" y2="560" stroke="#7a3db8" stroke-width="4" marker-end="url(#p)"/>
<line x1="570" y1="550" x2="700" y2="645" stroke="#1f7a4d" stroke-width="4" marker-end="url(#g)"/>
<rect x="1000" y="400" width="540" height="330" rx="16" fill="#f6f9fd" stroke="#2f6fb5" stroke-width="3"/>
<text x="1020" y="436" text-anchor="start" font-size="20" fill="#2f6fb5" font-weight="700">복합 경보 (Composite alarm)</text>
<text x="1020" y="468" text-anchor="start" font-size="16" fill="#444">여러 경보 상태를 AND · OR · NOT 으로 조합</text>
<rect x="1020" y="490" width="500" height="64" rx="10" fill="#fff" stroke="#2f6fb5" stroke-width="2"/>
<text x="1270" y="530" text-anchor="middle" font-size="17" fill="#222" font-weight="700">ALARM(CPU높음) AND ALARM(네트워크높음)</text>
<rect x="1020" y="570" width="500" height="64" rx="10" fill="#fff" stroke="#2f6fb5" stroke-width="2"/>
<text x="1270" y="610" text-anchor="middle" font-size="17" fill="#222" font-weight="700">ALARM(CPU높음) AND NOT ALARM(점검중)</text>
<text x="1020" y="664" text-anchor="start" font-size="15" fill="#444">점검 중에는 알림을 억제하는 데 쓸 수 있다</text>
<text x="1020" y="692" text-anchor="start" font-size="15" fill="#444">조합 경보 하나에서만 알리면 알림 소음이 줄어든다</text>
<text x="800" y="790" text-anchor="middle" font-size="16" fill="#666">장애 대응에서 가장 중요한 첫 단계는 얼마나 빨리 알아채는가이다</text>
</svg>