<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="Noto Sans CJK KR, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1600" height="720" fill="#fff"/>
<text x="800.0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#222">S3 접근 권한: 누가, 무엇을, 어떤 경로로</text>
<defs><marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2f6fb5"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#7a3db8"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#d9772b"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1f7a4d"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c0392b"/></marker><marker id="k" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#666666"/></marker><marker id="y" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b8860b"/></marker></defs>
<rect x="520" y="70" width="640" height="70" rx="14" fill="#fdecec" stroke="#c0392b" stroke-width="3"/>
<text x="840.0" y="103.0" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">퍼블릭 액세스 차단 (BPA)</text>
<text x="840.0" y="127.0" text-anchor="middle" font-size="15" fill="#444">정책·ACL이 허용하는 공개를 덮어써서 막는다</text>
<rect x="40" y="200" width="330" height="130" rx="14" fill="#e9f1fb" stroke="#2f6fb5" stroke-width="3"/>
<text x="205.0" y="263.0" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fb5">IAM 사용자 · 역할</text>
<text x="205.0" y="287.0" text-anchor="middle" font-size="15" fill="#444">IAM 정책 = 열쇠 (Principal 없음)</text>
<rect x="40" y="430" width="330" height="130" rx="14" fill="#f3eafb" stroke="#7a3db8" stroke-width="3"/>
<text x="205.0" y="493.0" text-anchor="middle" font-size="20" font-weight="700" fill="#7a3db8">다른 계정 · 익명 사용자</text>
<text x="205.0" y="517.0" text-anchor="middle" font-size="15" fill="#444">열쇠가 없으므로 버킷 정책으로 허용</text>
<rect x="520" y="190" width="640" height="400" rx="18" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="4"/>
<text x="840" y="232" text-anchor="middle" font-size="21" fill="#1f7a4d" font-weight="700">S3 버킷 (객체는 평평한 키의 집합)</text>
<rect x="560" y="260" width="560" height="90" rx="14" fill="#fff" stroke="#1f7a4d" stroke-width="3"/>
<text x="840.0" y="303.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">버킷 정책 = 문지기</text>
<text x="840.0" y="327.0" text-anchor="middle" font-size="15" fill="#444">Principal로 누구에게 어떤 작업을 허용할지 명시</text>
<rect x="560" y="390" width="270" height="52" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
<text x="695" y="422" text-anchor="middle" font-size="16" fill="#1f7a4d">images/logo.png</text>
<rect x="845" y="390" width="270" height="52" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
<text x="980" y="422" text-anchor="middle" font-size="16" fill="#1f7a4d">images/banner.jpg</text>
<rect x="560" y="460" width="270" height="52" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
<text x="695" y="492" text-anchor="middle" font-size="16" fill="#1f7a4d">home/alice/a.txt</text>
<rect x="845" y="460" width="270" height="52" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
<text x="980" y="492" text-anchor="middle" font-size="16" fill="#1f7a4d">home/bob/b.txt</text>
<text x="840" y="552" text-anchor="middle" font-size="15" fill="#2c5f44">리소스 지정: arn:aws:s3:::버킷/images/*  →  images/ 로 시작하는 모든 키</text>
<line x1="370" y1="265" x2="512" y2="300" stroke="#2f6fb5" stroke-width="4" marker-end="url(#b)"/>
<text x="430" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fb5">IAM 정책 허용</text>
<line x1="370" y1="495" x2="512" y2="330" stroke="#7a3db8" stroke-width="4" marker-end="url(#p)"/>
<text x="455" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3db8">버킷 정책 허용</text>
<rect x="1260" y="260" width="300" height="170" rx="14" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1410.0" y="343.0" text-anchor="middle" font-size="20" font-weight="700" fill="#777">ACL</text>
<text x="1410.0" y="367.0" text-anchor="middle" font-size="15" fill="#444">새 버킷은 기본 비활성</text>
<text x="1410" y="455" text-anchor="middle" font-size="15" fill="#888">권장하지 않음</text>
<text x="1410" y="478" text-anchor="middle" font-size="15" fill="#888">정책으로 대체 가능</text>
<text x="800" y="650" text-anchor="middle" font-size="16" fill="#444" font-weight="700">같은 계정: IAM 정책 또는 버킷 정책 중 하나만 허용해도 가능  ·  명시적 Deny는 항상 우선</text>
</svg>