name: Publish queued post

# 매일 00:00 UTC (= 한국 시간 09:00)에 _queue/ 의 가장 이른 글 1개를 _posts/ 로 옮겨 공개한다.
# 파일 이름의 날짜(YYYY-MM-DD-...)가 오늘(한국 시간) 이전이거나 같을 때만 옮긴다.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true면 옮기지 않고 어떤 글을 올릴지만 출력'
        required: true
        default: 'true'

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick next due post
        id: pick
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          echo "오늘(KST): $TODAY"
          NEXT=""
          if [ -d _queue ]; then
            for f in $(ls _queue/*.md 2>/dev/null | sort); do
              d=$(basename "$f" | cut -c1-10)
              if [[ "$d" > "$TODAY" ]]; then
                echo "다음 글 $f 는 아직 공개일 전입니다."
              else
                NEXT="$f"
              fi
              break
            done
          fi
          if [ -z "$NEXT" ]; then
            echo "공개할 글이 없습니다."
          else
            echo "공개 대상: $NEXT"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Move to _posts and push
        if: steps.pick.outputs.next != '' && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
        run: |
          mkdir -p _posts
          git mv "${{ steps.pick.outputs.next }}" _posts/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish queued post: $(basename '${{ steps.pick.outputs.next }}')"
          git push

      - name: Request GitHub Pages build
        if: steps.pick.outputs.next != '' && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "Pages 빌드 요청이 거부되었습니다. 푸시로 자동 빌드가 이어지는지 Actions 탭에서 확인하세요."
