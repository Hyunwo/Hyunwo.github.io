title: 정현우 | Cloud Infra Log
description: "쿠버네티스, AWS, DevOps 학습 기록"
url: "https://hyunwo.github.io"

# 테마 (Jekyll 기본 블로그 테마, 홈 화면에 글 목록을 자동으로 보여줌)
theme: minima

# 마크다운 처리 엔진 (GitHub Pages 기본값, 명시해두는 게 안전)
markdown: kramdown

# 퍼머링크 형식: /2026/07/22/vm-vs-container/ 형태로 생성
permalink: /:year/:month/:day/:title/

# 홈 화면에서 각 글 제목 아래에 본문 첫 문단을 미리보기로 보여줌
show_excerpts: true

# 홈 화면에 보여줄 글 개수
paginate: 10
paginate_path: "/page:num/"

# 우측 상단 네비게이션: 여기 명시한 페이지만 노출됨 (About만)
# kubernetes.md, aws.md는 사이드바 전용이라 여기서 제외
header_pages:
  - about.md

# 목차(TOC) 등에서 제외할 파일/폴더
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
