<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Noto Sans CJK KR, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1600" height="820" fill="#fff"/>
<text x="800.0" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#222">미리 서명된 URL과 멀티파트 업로드</text>
<defs><marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2f6fb5"/></marker><marker id="p" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#7a3db8"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#d9772b"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1f7a4d"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c0392b"/></marker><marker id="k" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#666666"/></marker><marker id="y" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b8860b"/></marker></defs>
<rect x="40" y="75" width="1520" height="330" rx="16" fill="#fafafa" stroke="#cfcfcf" stroke-width="2"/>
<text x="70" y="110" text-anchor="start" font-size="20" fill="#333" font-weight="700">① 미리 서명된 URL: 앱은 URL만 발급하고, 파일은 클라이언트와 S3가 직접 주고받는다</text>
<rect x="70" y="200" width="240" height="110" rx="14" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="3"/>
<text x="190.0" y="262.0" text-anchor="middle" font-size="20" font-weight="700" fill="#9a9a9a">클라이언트</text>
<rect x="620" y="200" width="300" height="110" rx="14" fill="#e9f1fb" stroke="#2f6fb5" stroke-width="3"/>
<text x="770.0" y="253.0" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fb5">애플리케이션</text>
<text x="770.0" y="277.0" text-anchor="middle" font-size="15" fill="#444">S3 권한을 가진 EC2 · Lambda 등</text>
<rect x="1230" y="180" width="290" height="150" rx="14" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="3"/>
<text x="1375.0" y="253.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">S3 버킷</text>
<text x="1375.0" y="277.0" text-anchor="middle" font-size="15" fill="#444">서명·만료·권한을 검증</text>
<line x1="318" y1="235" x2="612" y2="235" stroke="#2f6fb5" stroke-width="4" marker-end="url(#b)"/>
<text x="465" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fb5">① URL 요청</text>
<line x1="612" y1="285" x2="318" y2="285" stroke="#7a3db8" stroke-width="4" marker-end="url(#p)"/>
<text x="465" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#7a3db8">② 서명한 URL 발급</text>
<path d="M190,312 L190,352 L1375,352 L1375,338" fill="none" stroke="#1f7a4d" stroke-width="4" marker-end="url(#g)"/>
<text x="780" y="342" text-anchor="middle" font-size="17" fill="#1f7a4d" font-weight="700">③ URL로 S3에 직접 GET / PUT  (만료되면 실패)</text>
<text x="775" y="388" text-anchor="middle" font-size="15" fill="#555">권한은 URL을 만든 쪽의 자격 증명에서 나온다 · URL을 가진 사람은 누구나 사용 가능</text>
<rect x="40" y="430" width="1520" height="360" rx="16" fill="#fafafa" stroke="#cfcfcf" stroke-width="2"/>
<text x="70" y="465" text-anchor="start" font-size="20" fill="#333" font-weight="700">② 멀티파트 업로드: 파일을 나눠 올린 뒤 반드시 합치거나 중단한다</text>
<rect x="70" y="520" width="300" height="110" rx="14" fill="#fdf0e6" stroke="#d9772b" stroke-width="3"/>
<text x="220.0" y="573.0" text-anchor="middle" font-size="19" font-weight="700" fill="#d9772b">CreateMultipartUpload</text>
<text x="220.0" y="597.0" text-anchor="middle" font-size="15" fill="#444">업로드 ID 발급</text>
<rect x="470" y="520" width="360" height="110" rx="14" fill="#fdf0e6" stroke="#d9772b" stroke-width="3"/>
<text x="650.0" y="573.0" text-anchor="middle" font-size="19" font-weight="700" fill="#d9772b">UploadPart × N</text>
<text x="650.0" y="597.0" text-anchor="middle" font-size="15" fill="#444">파트 번호 1~10,000, ETag 기록</text>
<rect x="930" y="520" width="300" height="110" rx="14" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="3"/>
<text x="1080.0" y="573.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1f7a4d">CompleteMultipartUpload</text>
<text x="1080.0" y="597.0" text-anchor="middle" font-size="15" fill="#444">번호·ETag 목록으로 합침</text>
<rect x="1330" y="520" width="190" height="110" rx="14" fill="#e8f7ef" stroke="#1f7a4d" stroke-width="3"/>
<text x="1425.0" y="582.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f7a4d">객체 완성</text>
<line x1="370" y1="575" x2="462" y2="575" stroke="#d9772b" stroke-width="4" marker-end="url(#o)"/>
<line x1="830" y1="575" x2="922" y2="575" stroke="#1f7a4d" stroke-width="4" marker-end="url(#g)"/>
<line x1="1230" y1="575" x2="1322" y2="575" stroke="#1f7a4d" stroke-width="4" marker-end="url(#g)"/>
<rect x="470" y="690" width="760" height="70" rx="14" fill="#fdecec" stroke="#c0392b" stroke-width="3"/>
<text x="850.0" y="723.0" text-anchor="middle" font-size="17" font-weight="700" fill="#c0392b">완료·중단하지 않으면 파트가 남아 저장 비용 발생</text>
<text x="850.0" y="747.0" text-anchor="middle" font-size="15" fill="#444">AbortMultipartUpload 또는 수명 주기 AbortIncompleteMultipartUpload로 정리</text>
<line x1="650" y1="636" x2="650" y2="684" stroke="#c0392b" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#r)"/>
<text x="70" y="700" text-anchor="start" font-size="15" fill="#555">파트 5MiB~5GiB</text>
<text x="70" y="724" text-anchor="start" font-size="15" fill="#555">(마지막 파트는 제한 없음)</text>
<text x="70" y="752" text-anchor="start" font-size="15" fill="#555">객체 최대 50TB · 단일 PUT 5GB</text>
</svg>